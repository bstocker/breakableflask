name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: breakableflask:${{ github.sha }}

jobs:
  Dependances:
    name: Scan des dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scanner requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: requirements.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  Dockerfile:
    name: Scanner le Dockerfile et l'image
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Construire l'image
        run: docker build --tag "$IMAGE" .

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  Deploy:
    name: Validation du déploiement
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Résultat
        run: echo "Les contrôles de sécurité sont validés ; l'application est prête à être déployée."
